<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020712"/>
    </radialGradient>
    <radialGradient id="sphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020712" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="160" fill="url(#sphere)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="12 12" stroke-opacity="0.5"/>
  <text x="256" y="270" font-family="system-ui, sans-serif" font-weight="800" font-size="72" fill="#e0f2fe" text-anchor="middle" letter-spacing="4">J</text>
</svg>
